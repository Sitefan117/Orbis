name: Deploy to GitHub Pages

# Vérifie le dépôt, construit la version statique puis la publie sur GitHub Pages.
on:
  push:
    branches: 'main'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  # Une publication Pages déjà engagée ne doit pas être interrompue : GitHub
  # peut sinon conserver un verrou de déploiement et refuser les runs suivants.
  cancel-in-progress: false

jobs:
  # Construit et vérifie d'abord un artefact statique complet.
  build:
    runs-on: ubuntu-latest
    env:
      # Nécessaires dès `svelte-kit sync`, car la configuration publique est
      # compilée dans le site statique avant les étapes check et build.
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check types and Svelte files
        run: npm run check

      - name: Run smoke tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

  # La publication attend explicitement la fin du build. Cette séparation évite
  # les courses où GitHub Pages cherche l'artefact avant son référencement.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
